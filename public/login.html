<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GesFacture — Connexion & Inscription Sécurisée</title>
  <!-- Tailwind CSS CDN with forms plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Space Grotesk"', 'monospace'],
          },
          colors: {
            brand: {
              deep: '#110829',
              light: '#fbfbfe',
              purple: '#6d28d9',
              indigo: '#4f46e5',
            }
          },
          boxShadow: {
            'card-glow': '0 25px 50px -12px rgba(17, 8, 41, 0.12), 0 0 0 1px rgba(226, 232, 240, 0.8)',
            'btn-glow': '0 10px 25px -5px rgba(79, 70, 229, 0.4)',
          }
        }
      }
    };
  </script>
</head>
<body class="font-sans antialiased bg-[#fbfbfe] text-slate-900 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Ambient background glow matching landing page -->
  <div aria-hidden="true" class="pointer-events-none absolute -top-40 left-1/2 -translate-x-1/2 w-[720px] h-[450px] bg-gradient-to-b from-indigo-500/12 via-purple-500/5 to-transparent blur-3xl rounded-full"></div>
  <div aria-hidden="true" class="pointer-events-none absolute bottom-0 right-0 w-[420px] h-[360px] bg-indigo-500/5 blur-3xl rounded-full"></div>

  <!-- Top bar with link to Landing Page -->
  <div class="w-full max-w-[420px] mb-4 flex items-center justify-between relative z-10 px-1">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-indigo-600 transition-colors bg-white/90 hover:bg-white px-3.5 py-1.5 rounded-full border border-slate-200/90 shadow-sm backdrop-blur-md group">
      <svg class="w-3.5 h-3.5 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span>Retour à l'accueil</span>
    </a>
    <span class="text-[11px] font-semibold text-slate-400">
      GesFacture v2.4
    </span>
  </div>

  <!-- Main Card Container -->
  <div class="w-full max-w-[420px] bg-white rounded-3xl p-6 sm:p-8 border border-slate-200/90 shadow-card-glow space-y-5 text-center relative z-10 transition-all">
    
    <!-- Clickable Brand Logo linking to Landing Page -->
    <div class="flex flex-col items-center pt-1">
      <a href="index.html" class="inline-flex items-center gap-2.5 group mb-2 transition-transform hover:scale-105" title="Retour à la page d'accueil GesFacture">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-indigo-700 flex items-center justify-center text-white shadow-md shadow-indigo-500/25">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
          </svg>
        </div>
        <div class="flex flex-col text-left">
          <span class="font-extrabold text-xl text-[#110829] tracking-tight group-hover:text-indigo-600 transition-colors">
            GesFacture
          </span>
          <span class="text-[10px] uppercase font-bold tracking-widest text-indigo-600 -mt-1">
            Afrique
          </span>
        </div>
      </a>
      <p id="page-subtitle" class="text-xs sm:text-sm text-slate-500 max-w-xs mt-1">
        Connectez-vous pour accéder à vos factures et encaissements direct FCFA.
      </p>
    </div>

    <!-- Segmented Pill Switcher (Connexion / Inscription) -->
    <div id="tabs-container" class="relative p-1 bg-slate-100/90 rounded-2xl flex items-center select-none border border-slate-200/60">
      <div id="tab-pill" class="absolute top-1 bottom-1 left-1 w-[calc(50%-4px)] bg-white rounded-xl shadow-sm transition-all duration-200 ease-out"></div>
      <button type="button" id="tab-login-btn" class="relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-[#110829] rounded-xl transition-colors duration-150 cursor-pointer">
        Connexion
      </button>
      <button type="button" id="tab-signup-btn" class="relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-900 rounded-xl transition-colors duration-150 cursor-pointer">
        Inscription
      </button>
    </div>

    <!-- Forgot Password Header (Hidden by default) -->
    <div id="forgot-header" class="hidden items-center justify-between px-1 bg-slate-50 p-2 rounded-xl border border-slate-100">
      <button type="button" id="back-to-login-btn" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-600 hover:text-indigo-600 transition-colors cursor-pointer">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Retour à la connexion</span>
      </button>
      <span class="text-[11px] font-mono text-slate-400">Mot de passe oublié</span>
    </div>

    <!-- Feedback Message Box (hidden by default) -->
    <div id="feedback-box" class="hidden p-3 rounded-xl text-xs text-left animate-in fade-in"></div>

    <!-- Form -->
    <form id="auth-form" class="space-y-3.5 text-left" onsubmit="event.preventDefault(); handleAuthSubmit();">
      
      <!-- Full Name (Only for signup) -->
      <div id="field-fullname" class="hidden">
        <label class="block text-xs font-semibold text-slate-800 mb-1.5">
          Votre nom complet
        </label>
        <input type="text" id="fullname-input" placeholder="Amadou Fall" class="w-full px-3.5 py-2.5 sm:py-3 text-xs sm:text-sm bg-slate-50/70 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-500/10 transition-all" />
      </div>

      <!-- Email Address -->
      <div>
        <label class="block text-xs font-semibold text-slate-800 mb-1.5">
          Adresse email professionnelle
        </label>
        <input type="email" id="email-input" required placeholder="vous@entreprise.com" class="w-full px-3.5 py-2.5 sm:py-3 text-xs sm:text-sm bg-slate-50/70 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-500/10 transition-all" />
      </div>

      <!-- Password Field -->
      <div id="field-password">
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-semibold text-slate-800">
            Mot de passe
          </label>
          <button type="button" id="forgot-link-btn" class="text-[11px] text-indigo-600 hover:text-indigo-700 transition-colors font-medium hover:underline cursor-pointer">
            Mot de passe oublié ?
          </button>
        </div>
        <div class="relative">
          <input type="password" id="password-input" required placeholder="••••••••" class="w-full pl-3.5 pr-8 py-2.5 sm:py-3 text-xs sm:text-sm bg-slate-50/70 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-500/10 transition-all" />
          <button type="button" onclick="togglePasswordVisibility('password-input')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirm Password (Only for signup) -->
      <div id="field-confirm-password" class="hidden">
        <label class="block text-xs font-semibold text-slate-800 mb-1.5">
          Confirmez le mot de passe
        </label>
        <div class="relative">
          <input type="password" id="confirm-password-input" placeholder="Répétez votre mot de passe" class="w-full pl-3.5 pr-8 py-2.5 sm:py-3 text-xs sm:text-sm bg-slate-50/70 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:bg-white focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-500/10 transition-all" />
          <button type="button" onclick="togglePasswordVisibility('confirm-password-input')" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit CTA Button -->
      <div class="pt-1.5">
        <button type="submit" id="submit-btn" class="w-full py-3 sm:py-3.5 text-xs sm:text-sm font-bold text-white bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 hover:from-indigo-500 hover:to-purple-600 rounded-full transition-all active:scale-[0.99] shadow-btn-glow flex items-center justify-center gap-2 cursor-pointer">
          <span id="submit-btn-text">Se connecter</span>
          <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"></path>
          </svg>
        </button>
      </div>

      <!-- 1-Click Demo Shortcut -->
      <div id="demo-box" class="pt-2 text-center border-t border-slate-100 mt-2">
        <button type="button" onclick="handleDemoLogin()" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors inline-flex items-center gap-1.5 py-1 px-3 rounded-full hover:bg-indigo-50 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
          </svg>
          <span>Tester en mode Démo (1 clic direct)</span>
        </button>
      </div>
    </form>

    <!-- Security Trust Line -->
    <div class="pt-2 flex items-center justify-center gap-1.5 text-[11px] text-slate-400 font-medium">
      <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
      </svg>
      <span>Chiffrement SSL 256-bit · Données sécurisées</span>
    </div>
  </div>

  <!-- Bottom back button -->
  <div class="mt-5 text-center relative z-10">
    <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-400 hover:text-slate-700 transition-colors">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
      <span>Retour au site principal</span>
    </a>
  </div>

  <script>
    let currentMode = 'login'; // 'login' | 'signup' | 'forgot'

    const tabPill = document.getElementById('tab-pill');
    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabSignupBtn = document.getElementById('tab-signup-btn');
    const tabsContainer = document.getElementById('tabs-container');
    const forgotHeader = document.getElementById('forgot-header');
    const backToLoginBtn = document.getElementById('back-to-login-btn');
    const forgotLinkBtn = document.getElementById('forgot-link-btn');
    const fieldFullname = document.getElementById('field-fullname');
    const fieldPassword = document.getElementById('field-password');
    const fieldConfirmPassword = document.getElementById('field-confirm-password');
    const submitBtnText = document.getElementById('submit-btn-text');
    const pageSubtitle = document.getElementById('page-subtitle');
    const demoBox = document.getElementById('demo-box');
    const feedbackBox = document.getElementById('feedback-box');

    function setMode(mode) {
      currentMode = mode;
      feedbackBox.classList.add('hidden');

      if (mode === 'login') {
        tabsContainer.classList.remove('hidden');
        forgotHeader.classList.add('hidden');
        forgotHeader.classList.remove('flex');
        tabPill.style.left = '4px';
        tabLoginBtn.className = 'relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-[#110829] rounded-xl transition-colors duration-150 cursor-pointer';
        tabSignupBtn.className = 'relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-900 rounded-xl transition-colors duration-150 cursor-pointer';
        fieldFullname.classList.add('hidden');
        fieldPassword.classList.remove('hidden');
        fieldConfirmPassword.classList.add('hidden');
        submitBtnText.textContent = 'Se connecter';
        pageSubtitle.textContent = 'Connectez-vous pour accéder à vos factures et encaissements direct FCFA.';
        demoBox.classList.remove('hidden');
      } else if (mode === 'signup') {
        tabsContainer.classList.remove('hidden');
        forgotHeader.classList.add('hidden');
        forgotHeader.classList.remove('flex');
        tabPill.style.left = 'calc(50% + 2px)';
        tabLoginBtn.className = 'relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-slate-500 hover:text-slate-900 rounded-xl transition-colors duration-150 cursor-pointer';
        tabSignupBtn.className = 'relative z-10 flex-1 py-2 text-xs sm:text-sm font-bold text-[#110829] rounded-xl transition-colors duration-150 cursor-pointer';
        fieldFullname.classList.remove('hidden');
        fieldPassword.classList.remove('hidden');
        fieldConfirmPassword.classList.remove('hidden');
        submitBtnText.textContent = 'Créer mon compte gratuitement';
        pageSubtitle.textContent = 'Créez votre compte en 30 secondes pour facturer et encaisser en FCFA.';
        demoBox.classList.add('hidden');
      } else if (mode === 'forgot') {
        tabsContainer.classList.add('hidden');
        forgotHeader.classList.remove('hidden');
        forgotHeader.classList.add('flex');
        fieldFullname.classList.add('hidden');
        fieldPassword.classList.add('hidden');
        fieldConfirmPassword.classList.add('hidden');
        submitBtnText.textContent = 'Envoyer le lien de réinitialisation';
        pageSubtitle.textContent = 'Récupérez l\'accès sécurisé à votre compte GesFacture.';
        demoBox.classList.add('hidden');
      }
    }

    tabLoginBtn.addEventListener('click', () => setMode('login'));
    tabSignupBtn.addEventListener('click', () => setMode('signup'));
    forgotLinkBtn.addEventListener('click', () => setMode('forgot'));
    backToLoginBtn.addEventListener('click', () => setMode('login'));

    // Check URL parameters on load (e.g., login.html?tab=signup)
    const urlParams = new URLSearchParams(window.location.search);
    const initialTab = urlParams.get('tab');
    if (initialTab === 'signup') {
      setMode('signup');
    } else if (initialTab === 'forgot') {
      setMode('forgot');
    }

    function togglePasswordVisibility(inputId) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
      } else {
        input.type = 'password';
      }
    }

    function handleDemoLogin() {
      document.getElementById('email-input').value = 'admin@gesfacture.sn';
      document.getElementById('password-input').value = 'demo1234';
      feedbackBox.className = 'p-3 rounded-xl text-xs text-left bg-emerald-50 border border-emerald-200 text-emerald-800 flex items-center gap-2';
      feedbackBox.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>Connexion Démo réussie ! Redirection en cours...</span>';
      feedbackBox.classList.remove('hidden');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1200);
    }

    function handleAuthSubmit() {
      const email = document.getElementById('email-input').value;
      if (currentMode === 'forgot') {
        feedbackBox.className = 'p-3 rounded-xl text-xs text-left bg-emerald-50 border border-emerald-200 text-emerald-800';
        feedbackBox.textContent = 'Un email de réinitialisation a été envoyé à ' + email + '. Vérifiez votre boîte de réception.';
        feedbackBox.classList.remove('hidden');
      } else if (currentMode === 'signup') {
        feedbackBox.className = 'p-3 rounded-xl text-xs text-left bg-emerald-50 border border-emerald-200 text-emerald-800';
        feedbackBox.textContent = 'Compte créé avec succès ! Bienvenue sur GesFacture.';
        feedbackBox.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);
      } else {
        feedbackBox.className = 'p-3 rounded-xl text-xs text-left bg-emerald-50 border border-emerald-200 text-emerald-800';
        feedbackBox.textContent = 'Connexion réussie ! Redirection vers votre espace de facturation...';
        feedbackBox.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      }
    }
  </script>
</body>
</html>
